<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
        </svg>
        <span class="brand-name">WeatherPulse</span>
      </div>

      <div class="header-actions">
        <!-- Unit Toggle Button -->
        <button id="unit-toggle" class="btn-unit-toggle" aria-label="Toggle Temperature Unit">
          <span class="unit-opt active" data-unit="metric">°C</span>
          <span class="unit-divider">/</span>
          <span class="unit-opt" data-unit="imperial">°F</span>
        </button>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <form id="search-form" class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="city-input" placeholder="Search city (e.g. London, Tokyo, New York)..." autocomplete="off" required />
        <button type="submit" class="btn-primary">Search</button>
      </form>
      <button id="geo-btn" class="btn-icon-labeled" title="Use current location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
        <span>Current Location</span>
      </button>
    </section>

    <!-- Pinned / Favorite Cities Row -->
    <section id="favorites-section" class="favorites-section hidden">
      <div class="favorites-label">Pinned Cities:</div>
      <div id="favorites-container" class="favorites-container">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- Feedback Message / Alert -->
    <div id="error-message" class="error-message hidden" role="alert"></div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="loading-container hidden">
      <div class="spinner"></div>
      <p>Fetching weather data...</p>
    </div>

    <!-- Weather Content -->
    <main id="weather-content" class="weather-content hidden">
      <!-- Current Weather Hero Card -->
      <div class="card current-weather-card">
        <div class="current-header">
          <div class="city-title-wrapper">
            <h1 id="city-name" class="city-name">--</h1>
            <button id="favorite-btn" class="btn-fav" aria-label="Pin city to favorites" title="Pin city">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>
            <p id="current-date" class="date-text">--</p>
          </div>
          <span id="weather-badge" class="weather-badge">--</span>
        </div>

        <div class="current-main">
          <div class="temp-wrapper">
            <span id="current-temp" class="temp-display">--</span>
            <span id="current-temp-unit" class="temp-unit">°C</span>
          </div>
          <div class="weather-visual">
            <img id="current-icon" src="" alt="Weather condition icon" />
            <p id="current-condition" class="condition-text">--</p>
          </div>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
          <div class="metric-item">
            <span class="metric-label">Feels Like</span>
            <span id="metric-feels" class="metric-value">--°C</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Humidity</span>
            <span id="metric-humidity" class="metric-value">--%</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Wind Speed</span>
            <span id="metric-wind" class="metric-value">-- km/h</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Pressure</span>
            <span id="metric-pressure" class="metric-value">-- hPa</span>
          </div>
        </div>
      </div>

      <!-- Air Quality Index (AQI) Card -->
      <section id="aqi-section" class="card aqi-card">
        <div class="aqi-header">
          <div>
            <h2 class="section-title">Air Quality Index</h2>
            <p id="aqi-advisory" class="aqi-advisory">--</p>
          </div>
          <div class="aqi-badge-wrapper">
            <span id="aqi-badge" class="aqi-badge">--</span>
          </div>
        </div>

        <div class="aqi-components-grid">
          <div class="aqi-component-item">
            <span class="aqi-comp-label">PM2.5</span>
            <span id="aqi-pm25" class="aqi-comp-value">-- µg/m³</span>
          </div>
          <div class="aqi-component-item">
            <span class="aqi-comp-label">PM10</span>
            <span id="aqi-pm10" class="aqi-comp-value">-- µg/m³</span>
          </div>
          <div class="aqi-component-item">
            <span class="aqi-comp-label">NO₂</span>
            <span id="aqi-no2" class="aqi-comp-value">-- µg/m³</span>
          </div>
          <div class="aqi-component-item">
            <span class="aqi-comp-label">O₃</span>
            <span id="aqi-o3" class="aqi-comp-value">-- µg/m³</span>
          </div>
        </div>
      </section>

      <!-- 24-Hour Forecast Section -->
      <section class="hourly-section">
        <div class="section-header">
          <h2 class="section-title">Hourly Forecast (Next 24h)</h2>
        </div>
        <div id="hourly-track" class="hourly-track">
          <!-- Populated dynamically via JS -->
        </div>
      </section>

      <!-- 3-Day Forecast Section -->
      <section class="forecast-section">
        <h2 class="section-title">3-Day Forecast</h2>
        <div id="forecast-grid" class="forecast-grid">
          <!-- Cards populated via JS -->
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
